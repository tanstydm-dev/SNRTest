<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=gb2312" />
    <meta name="keywords" content="天地图" />
    <title>天地图－地图API－范例－经纬度直投地图</title>
    <script type="text/javascript" src="http://api.tianditu.gov.cn/api?v=4.0&tk=b6e4eb8378e628768175a205bb35375d"></script>
    <script>
            var map;
            var zoom = 12;
            function onLoad()
            {
                var config = {
                    projection: "EPSG:4326"
                }
                //初始化地图对象
                map = new TMap("mapDiv", config);
                //设置显示地图的中心点和级别
                map.centerAndZoom(new TLngLat(116.40969, 39.89945), zoom);
            }
    </script>
</head>
<body onLoad="onLoad()">
    <div id="mapDiv" style="position:absolute;width:100%; height:100%"></div>
    <div style="position:absolute;left:620px;">
    </div>
</body>
</html>
